encoder: e_branchformer
encoder_conf:
  output_size: 192
  attention_heads: 4
  linear_units: 768
  num_blocks: 8
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d
  pos_enc_layer_type: rel_pos
  cgmlp_linear_units: 768
  use_linear_after_conv: false

decoder: null

model_conf:
  ctc_weight: 1.0
  lsm_weight: 0.0
  length_normalized_loss: false
  # 추가 (Acoustic Conditioning )
  use_acoustic_conditioning: true
  acoustic_dim: 11
  acoustic_condition_hidden_dim: 128
  acoustic_condition_dropout: 0.1

optim: adamW
optim_conf:
  lr: 0.001

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 25000

max_epoch: 30
batch_type: numel
batch_bins: 8000000
accum_grad: 2
patience: 3
